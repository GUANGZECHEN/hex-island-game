name: Verify 3D art refinement before publication
on:
  push:
    branches: [art/refinement-pass-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate source and build
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0 pngjs@7.0.0
          npx playwright install --with-deps chromium > /dev/null
      - name: Verify art and integrated game in real Chromium
        run: |
          node scripts/qa-art-refinement.mjs
          node scripts/qa-three-live.mjs
      - name: Upload render evidence and built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-refinement-evidence
          retention-days: 7
          path: |
            art-evidence
            three-evidence
            dist
