name: Validate integrated 3D gameplay before deployment
on:
  push:
    branches: [art/three-live]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: three-live-validation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply asserted integration once and lock dependencies
        run: |
          if [[ -f scripts/apply-three-live.py ]]; then python3 scripts/apply-three-live.py; fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Validate application and signaling
        run: |
          npm run typecheck
          npm test
          (cd signaling && npm ci --no-audit --no-fund && npm run typecheck && npm test)
      - name: Install actual browser test tools
        run: |
          npm install --no-save playwright@1.58.0 pngjs@7.0.0 --no-audit --no-fund
          npx playwright install --with-deps chromium > /tmp/three-browser-install.log
      - name: Build and start isolated test backend and site
        env:
          VITE_SIGNALING_URL: http://127.0.0.1:8787
        run: |
          npm run build
          setsid bash -c 'cd signaling && exec npm exec -- wrangler dev --local --ip 127.0.0.1 --port 8787 --config wrangler.qa.jsonc' > /tmp/three-worker.log 2>&1 &
          setsid npm exec -- vite preview --host 127.0.0.1 --port 4175 --strictPort > /tmp/three-preview.log 2>&1 &
          for i in {1..40}; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://guangzechen.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' http://127.0.0.1:8787/rooms || true)
            if [[ "$status" == 204 ]] && curl -sf http://127.0.0.1:4175/hex-island-game/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/three-worker.log /tmp/three-preview.log
          exit 1
      - name: Actual 3D game pixels, commands, camera and multiplayer
        env:
          QA_URL: http://127.0.0.1:4175/hex-island-game/?qaPlayers=2
          QA_SIGNALING_URL: http://127.0.0.1:8787
        run: node scripts/qa-three-live.mjs
      - name: Original SVG fallback and recovery regression
        env:
          QA_URL: http://127.0.0.1:4175/hex-island-game/?qaPlayers=2
          QA_SIGNALING_URL: http://127.0.0.1:8787
        run: node scripts/qa-e2e.mjs
      - name: Save exact tested sources for review
        if: always()
        run: |
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./signaling/node_modules' --exclude='./signaling/.wrangler' --exclude='./dist' --exclude='./three-evidence' --exclude='./tested-source.tar.gz' -czf "$RUNNER_TEMP/tested-source.tar.gz" .
      - name: Upload tested build, evidence and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-live-evidence
          retention-days: 7
          path: |
            three-evidence
            dist
            package-lock.json
            ${{ runner.temp }}/tested-source.tar.gz
      - name: Commit only the validated integration on its isolated branch
        if: success()
        run: |
          set -euo pipefail
          git fetch origin art/three-live
          test "$(git rev-parse origin/art/three-live)" = "$GITHUB_SHA"
          rm -f scripts/apply-three-live.py .github/workflows/three-workbench.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json index.html src/game-ui.ts src/game/ui/compact-layout.ts scripts/qa-e2e.mjs .github/workflows/qa-pages.yml
          git add -u scripts/apply-three-live.py .github/workflows/three-workbench.yml
          if ! git diff --cached --quiet; then
            git commit -m 'feat(3d): connect validated scene to actual game and lock Three.js dependencies'
            git push origin HEAD:art/three-live
          fi
          echo "Validated source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
