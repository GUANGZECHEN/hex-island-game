name: Cloudflare relay runtime smoke

on:
  push:
    branches: [game/mvp]
    paths:
      - 'signaling/**'
      - 'scripts/deploy-signaling.sh'
      - 'scripts/signaling-deploy-origin.mjs'
      - '.github/workflows/cloud-relay-smoke.yml'

permissions:
  contents: read

jobs:
  relay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: signaling/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy temporary Cloudflare Worker and verify relay
        id: deploy
        env:
          DEPLOYMENT_MODE: temporary
          WRANGLER_LOG_SANITIZE: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: bash ../scripts/deploy-signaling.sh
