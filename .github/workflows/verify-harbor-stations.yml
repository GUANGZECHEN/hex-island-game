name: Verify harbor trade stations
on:
  push:
    branches: [feature/harbor-stations]
permissions:
  contents: write
concurrency:
  group: harbor-stations-preflight
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply reviewed station and owner-only road patches
        run: node scripts/apply-harbor-stations.mjs
      - name: Install and regenerate paired design documents
        run: |
          npm ci
          python3 -m venv "$RUNNER_TEMP/station-docs"
          "$RUNNER_TEMP/station-docs/bin/pip" install --quiet python-docx==1.2.0
          "$RUNNER_TEMP/station-docs/bin/python" scripts/sync-harbor-docs.py
      - name: Typecheck tests and production build
        run: npm run typecheck && npm test && npm run build
      - name: Prepare real software WebGL browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0 pngjs@7.0.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Test stations asymmetric opening finite orders and road ownership
        run: node scripts/qa-harbor-coop.mjs
      - name: Verify classic rendering direct targets and camera stability
        run: |
          node scripts/qa-three-live.mjs
          node scripts/qa-target-feedback.mjs
          CAMERA_EXPECT_STABLE=1 node scripts/qa-card-camera.mjs
      - name: Export verified source objects without publishing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/export-harbor-stations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-stations-verified
          retention-days: 7
          path: |
            harbor-evidence
            three-evidence
            target-evidence
            camera-evidence
