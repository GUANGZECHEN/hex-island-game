name: Deploy game/mvp QA to GitHub Pages

on:
  push:
    branches: [game/mvp]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-mvp-qa
  cancel-in-progress: true

jobs:
  signaling:
    uses: ./.github/workflows/deploy-signaling.yml
    permissions:
      contents: read

  qa:
    needs: signaling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build QA frontend against Cloudflare Worker
        env:
          VITE_SIGNALING_URL: ${{ needs.signaling.outputs.worker_origin }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Wait for Pages artifact metadata
        run: sleep 5

      - name: Deploy QA Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report QA endpoint
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SIGNALING_URL: ${{ needs.signaling.outputs.worker_origin }}
        run: |
          {
            echo '## Cloudflare Worker QA'
            echo
            echo "QA page: ${PAGE_URL}?qaPlayers=2"
            echo
            echo "Transport: Cloudflare-hosted temporary Worker + SQLite Durable Object."
            echo "The Worker runtime smoke already verified room creation, CORS, host+guest WebSockets and bidirectional relay."
            echo "This temporary Worker is expected to expire after about 60 minutes; rerun is automatic on the next game/mvp push."
          } >> "$GITHUB_STEP_SUMMARY"
