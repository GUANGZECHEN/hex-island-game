name: Deploy game/mvp QA to GitHub Pages

on:
  push:
    branches: [game/mvp]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-mvp-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            signaling/package-lock.json

      - name: Install and validate
        run: |
          npm ci
          npm run typecheck
          npm test
          (cd signaling && npm ci && npm run typecheck && npm test)

      - name: Generate ephemeral QA creator capability
        run: |
          set -euo pipefail
          read -r capability hash < <(node scripts/creator-capability.mjs --machine)
          echo "::add-mask::$capability"
          printf 'QA_CREATOR_CAPABILITY=%s\nQA_CREATOR_CAPABILITY_HASH=%s\n' "$capability" "$hash" >> "$GITHUB_ENV"

      - name: Start shared Worker and Durable Object-compatible QA backend
        run: |
          set -euo pipefail
          setsid bash -c 'cd signaling && exec npm exec -- wrangler dev --local --ip 127.0.0.1 --port 8787 --config wrangler.jsonc --var "CREATOR_CAPABILITY_HASH:$QA_CREATOR_CAPABILITY_HASH"' >"$RUNNER_TEMP/wrangler-qa.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wrangler-qa.pid"
          for attempt in {1..30}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request OPTIONS \
              --header 'Origin: https://guangzechen.github.io' \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              --max-time 5 \
              http://127.0.0.1:8787/rooms || true)
            if [[ "$status" == "204" ]]; then exit 0; fi
            sleep 1
          done
          echo '::error::Shared QA Worker did not become ready.'
          exit 1

      - name: Install pinned cloudflared
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.6/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          echo '1d356dac769d0dbf62ebe588c4034824bbff98d5790c2f844cc99e0e2f57462d  '"$RUNNER_TEMP"'/cloudflared' | sha256sum --check -
          chmod 700 "$RUNNER_TEMP/cloudflared"

      - name: Start public QA ingress
        run: |
          set -euo pipefail
          setsid "$RUNNER_TEMP/cloudflared" tunnel \
            --url http://127.0.0.1:8787 \
            --no-autoupdate \
            --loglevel info \
            >"$RUNNER_TEMP/cloudflared-qa.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared-qa.pid"

          tunnel_url=''
          for attempt in {1..45}; do
            tunnel_url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared-qa.log" | head -n 1 || true)
            if [[ -n "$tunnel_url" ]]; then break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/cloudflared-qa.pid")" 2>/dev/null; then
              echo '::error::QA ingress process exited before publishing an endpoint.'
              exit 1
            fi
            sleep 1
          done
          if [[ ! "$tunnel_url" =~ ^https://[a-z0-9-]+\.trycloudflare\.com$ ]]; then
            echo '::error::QA ingress did not provide a valid endpoint.'
            exit 1
          fi
          echo "QA_SIGNALING_URL=$tunnel_url" >> "$GITHUB_ENV"

      - name: Wait for QA ingress propagation
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request OPTIONS \
              --header 'Origin: https://guangzechen.github.io' \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              --max-time 8 \
              "$QA_SIGNALING_URL/rooms" || true)
            if [[ "$status" == "204" ]]; then exit 0; fi
            sleep 2
          done
          echo '::error::QA ingress did not become reachable within the propagation window.'
          exit 1

      - name: Verify full relay path
        run: CREATOR_CAPABILITY="$QA_CREATOR_CAPABILITY" node signaling/scripts/smoke.mjs "$QA_SIGNALING_URL"

      - name: Build QA frontend
        env:
          VITE_SIGNALING_URL: ${{ env.QA_SIGNALING_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Wait for Pages artifact metadata
        run: sleep 5

      - name: Deploy QA Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Run real Chromium multiplayer, reconnect and rejoin E2E
        env:
          QA_URL: ${{ steps.deployment.outputs.page_url }}?qaPlayers=2
          QA_CREATOR_CAPABILITY: ${{ env.QA_CREATOR_CAPABILITY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-e2e"
          cp scripts/qa-e2e.mjs "$RUNNER_TEMP/qa-e2e/qa-e2e.mjs"
          cd "$RUNNER_TEMP/qa-e2e"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.58.0
          npx playwright install --with-deps chromium >/dev/null
          node qa-e2e.mjs

      - name: Report live QA window
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo '## Reconnect-tested two-browser QA'
            echo
            echo "QA page: ${PAGE_URL}?qaPlayers=2"
            echo 'The same signaling implementation is separately runtime-smoked on real Cloudflare Workers + SQLite Durable Objects.'
            echo 'Chromium E2E passed creator-authorized room creation, guest invite isolation, ready/start, forced guest network loss, automatic reconnect, manual Rejoin previous room, seat resync and post-recovery state synchronization.'
            echo 'The workflow creator capability is ephemeral, masked, and never published in the Pages build or summary.'
            echo 'This QA ingress is temporary and the live window is bounded to about 50 minutes.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep QA ingress online
        run: |
          set -euo pipefail
          for minute in {1..50}; do
            sleep 60
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request OPTIONS \
              --header 'Origin: https://guangzechen.github.io' \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              --max-time 10 \
              "$QA_SIGNALING_URL/rooms" || true)
            if [[ "$status" != "204" ]]; then
              sleep 5
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --request OPTIONS \
                --header 'Origin: https://guangzechen.github.io' \
                --header 'Access-Control-Request-Method: POST' \
                --header 'Access-Control-Request-Headers: content-type' \
                --max-time 10 \
                "$QA_SIGNALING_URL/rooms" || true)
            fi
            if [[ "$status" != "204" ]]; then
              echo "::error::QA ingress became unavailable during minute $minute."
              exit 1
            fi
          done

      - name: Cleanup QA processes
        if: always()
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/cloudflared-qa.pid" ]]; then
            kill -- -"$(cat "$RUNNER_TEMP/cloudflared-qa.pid")" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/wrangler-qa.pid" ]]; then
            kill -- -"$(cat "$RUNNER_TEMP/wrangler-qa.pid")" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/cloudflared-qa.log" "$RUNNER_TEMP/cloudflared-qa.pid" \
            "$RUNNER_TEMP/cloudflared" "$RUNNER_TEMP/wrangler-qa.log" "$RUNNER_TEMP/wrangler-qa.pid"
