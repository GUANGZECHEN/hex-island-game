name: Deploy signaling Worker
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      worker_origin:
        description: HTTPS origin of the deployed signaling Worker
        value: ${{ jobs.deploy.outputs.worker_origin }}
      deployment_mode:
        description: temporary or permanent
        value: ${{ jobs.deploy.outputs.deployment_mode }}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      worker_origin: ${{ steps.deploy.outputs.worker_origin }}
      deployment_mode: ${{ steps.mode.outputs.mode }}
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: signaling/package-lock.json
      - name: Select deployment mode
        id: mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../scripts/signaling-deploy-mode.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy Worker and report origin
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_MODE: ${{ steps.mode.outputs.mode }}
          WRANGLER_LOG_SANITIZE: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: bash ../scripts/deploy-signaling.sh
