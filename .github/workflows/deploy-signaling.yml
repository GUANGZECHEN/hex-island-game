name: Deploy signaling Worker
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      worker_origin:
        description: HTTPS origin of the deployed signaling Worker
        value: ${{ jobs.deploy.outputs.worker_origin }}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      worker_origin: ${{ steps.origin.outputs.worker_origin }}
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: signaling/package-lock.json
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID Actions secrets before deploying.'
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_SANITIZE: 'true'
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/signaling-deploy.jsonl
        run: |
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"
          npm exec -- wrangler deploy --config wrangler.jsonc
      - name: Report Worker origin
        id: origin
        run: node ../scripts/signaling-deploy-origin.mjs "$RUNNER_TEMP/signaling-deploy.jsonl"
