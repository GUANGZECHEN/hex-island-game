name: Verify harbor cooperative mode
on:
  push:
    branches: [feature/harbor-orders]
permissions:
  contents: write
concurrency:
  group: harbor-coop-preflight
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply checksum-verified cooperative source
        run: node scripts/apply-harbor-patch.mjs
      - name: Install and regenerate matching design documents
        run: |
          npm ci
          python3 -m venv "$RUNNER_TEMP/harbor-docs"
          "$RUNNER_TEMP/harbor-docs/bin/pip" install --quiet python-docx==1.2.0
          "$RUNNER_TEMP/harbor-docs/bin/python" scripts/sync-harbor-docs.py
      - name: Typecheck unit tests and production build
        run: npm run typecheck && npm test && npm run build
      - name: Prepare software WebGL browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0 pngjs@7.0.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify real 3D cooperative flow and classic regression
        run: |
          node scripts/qa-harbor-coop.mjs
          node scripts/qa-three-live.mjs
          node scripts/qa-target-feedback.mjs
          CAMERA_EXPECT_STABLE=1 node scripts/qa-card-camera.mjs
      - name: Export verified source blobs without changing live branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/export-harbor-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-coop-verified
          retention-days: 7
          path: |
            harbor-evidence
            three-evidence
            target-evidence
            camera-evidence
